[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200

# Arc Mainnet. Referenced by name from fork tests via vm.rpcUrl("arc"), so the measurements can be
# checked against the live chain on a plain `forge test` with no extra CLI flag.
[rpc_endpoints]
arc = "https://rpc.mainnet.arc.io"
